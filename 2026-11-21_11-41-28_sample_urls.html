const FRESH = 5;

const safe = u => /^https?:\/\//i.test(u || "") ? u : "";
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function fmt(iso){ if (!iso) return ""; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("en-US", {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit", hour12:false}); }

function media(a){
  // one player area + (if the ad has several clips) a strip of clip buttons.
  // Nothing but small thumbnails is downloaded: a video loads only after you click play / a clip.
  const wrap = el("div", "mwrap");
  const m = el("div", "media"); wrap.append(m);
  const clips = a.clips && a.clips.length ? a.clips : [];
  let cur = 0;

  function showClip(i, autoplay){
    cur = i;
    const c = clips[i] || {};
    m.replaceChildren();
    if (c.poster) { const im = document.createElement("img"); im.loading = "lazy"; im.alt = ""; im.src = c.poster; m.append(im); }
    else m.append(el("div", "none", c.video ? "" : "no preview saved"));
    if (c.video) {
      m.append(el("span", "pill l", "\u25CF video loads when you press play"));
      const b = el("button", "play", "\u25B6"); b.type = "button"; b.setAttribute("aria-label", "Play video");
      b.onclick = () => load(c);
      m.append(b);
      if (autoplay) load(c);
    }
    if (clips.length > 1) m.append(el("span", "pill r", `${clips.length} clips \u00b7 ${clips.filter(x => x.video).length} video`));
    strip && [...strip.children].forEach((x, k) => x.classList.toggle("on", k === i));
  }
  function load(c){
    const v = document.createElement("video");
    v.controls = true; v.autoplay = true; v.playsInline = true; v.preload = "auto"; v.src = c.video;
    if (c.poster) v.poster = c.poster;
    v.addEventListener("error", () => v.replaceWith(el("div", "none", "video link no longer works")));
    m.replaceChildren(v);
  }
  let strip = null;
  if (clips.length > 1) {
    strip = el("div", "strip");
    clips.forEach((c, i) => {
      const b = el("button", "clip", c.video ? "\u25B6" : String(i + 1)); b.type = "button";
      b.setAttribute("aria-label", `Clip ${i + 1} of ${clips.length}`);
      b.onclick = () => showClip(i, true);            // clicking a clip loads and plays that clip
      strip.append(b);
    });
    wrap.append(strip);
  }
  showClip(0, false);
  return wrap;
}

function card(a){
  const k = el("article", "card");
  k.append(media(a));
  const b = el("div", "body"); k.append(b);
  const dest = safe(a.destination) || safe(a.store_url);
  const r = el("div", "row"); r.append(el("span", "sig", a.sig));
  if (a.ads > 1) r.append(el("span", "tag", a.ads + " ads"));
  const text = (a.headline || a.text || "").trim();
  if (text && (a.destination || a.headline)) r.append(el("div", "hl", text));
  else r.append(el("span", "tag", "Ad destination"));
  b.append(r);
  const d = el("a", "dest", dest || a.store); d.href = dest || "#"; d.target = "_blank"; d.rel = "noopener noreferrer"; d.title = dest; b.append(d);
  if (a.text && a.text !== text) b.append(el("p", "txt", a.text));
  const fresh = a.days != null && a.days < FRESH;
  const age = el("p", "age" + (fresh ? " fresh" : ""), a.days == null ? "start date unknown" : `${a.days}D running — ${fresh ? "fresh" : "established"}`);
  b.append(age);
  b.append(el("p", "cap", "Captured " + fmt(a.captured)));
  const btns = el("div", "btns");
  const v = el("a", "", "Visit site"); v.href = dest || "#"; v.target = "_blank"; v.rel = "noopener noreferrer"; btns.append(v);
  const cp = el("button", "", "Copy"); cp.type = "button";
  cp.onclick = async () => { try { await navigator.clipboard.writeText(dest); cp.textContent = "Copied"; } catch (e) { cp.textContent = "Press Ctrl+C"; } setTimeout(() => cp.textContent = "Copy", 1400); };
  btns.append(cp); b.append(btns);
  const f = el("a", "find", "◎ Find in Ads Library"); f.href = safe(a.link) || "#"; f.target = "_blank"; f.rel = "noopener noreferrer"; b.append(f);
  return k;
}

function draw(){
  let list = D.ads.filter(a => (!store || a.store === store) &&
    (filter === "all" || (filter === "fresh" ? (a.days != null && a.days < FRESH) : (a.days == null || a.days >= FRESH))));
  list.sort((x, y) => sort === "new" ? (x.days ?? 1e9) - (y.days ?? 1e9) : (y.days ?? -1) - (x.days ?? -1));
  $("#grid").replaceChildren(...list.map(card));
  $("#empty").hidden = list.length > 0;
}
$("#f1").onclick = e => { const b = e.target.closest("button"); if (!b) return; filter = b.dataset.f;
  document.querySelectorAll("#f1 button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
$("#f2").onclick = e => { const b = e.target.closest("button"); if (!b) return; sort = b.dataset.s;
  document.querySelectorAll("#f2 button").forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); };
$("#store").onchange = e => { store = e.target.value; draw(); };
draw();
